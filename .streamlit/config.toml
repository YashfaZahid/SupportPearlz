[theme]
base = "dark"
primaryColor = "#C026D3"
backgroundColor = "#0A0A0B"
secondaryBackgroundColor = "#141416"
textColor = "#F4F4F5"
font = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
headingFont = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap"
baseRadius = "1rem"
buttonRadius = "0.85rem"
borderColor = "#2A2A2E"
showWidgetBorder = true
showSidebarBorder = false
linkColor = "#E879F9"
headingFontSizes = ["1.75rem", "1.35rem", "1.15rem", "1.05rem", "1rem", "0.95rem"]
codeBackgroundColor = "#1A1A1E"
redColor = "#F472B6"
paddingTop = "1.25rem"
paddingBottom = "1.25rem"

[theme.sidebar]
backgroundColor = "#121214"
secondaryBackgroundColor = "#1A1A1E"
textColor = "#E4E4E7"
primaryColor = "#C026D3"
borderColor = "#2A2A2E"
linkColor = "#E879F9"
paddingTop = "1.5rem"

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
